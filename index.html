<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="format-detection" content="telephone=no" />
<title>Tangle — Rope Match</title>
<link rel="stylesheet" href="css/style.css?v=spring16ray" />
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>
    <canvas id="fx"></canvas>
    <div id="hud">
      <button id="btn-settings" class="btn-gear" aria-label="설정">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.07 7.07 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.8a.5.5 0 0 0-.49.42l-.36 2.54c-.6.24-1.14.55-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.48a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.43.34.68.22l2.39-.96c.5.4 1.04.71 1.63.94l.36 2.54c.05.24.25.42.49.42h3.8c.24 0 .44-.18.49-.42l.36-2.54c.6-.24 1.14-.55 1.63-.94l2.39.96c.25.1.54 0 .68-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg>
      </button>
      <div id="hud-pill">
        <div class="pill-level">
          <span class="lvl-label">Level</span>
          <span class="lvl-num" id="hud-level">1</span>
        </div>
        <div class="pill-timer">
          <svg class="clock-svg" viewBox="0 0 64 64" aria-hidden="true">
            <path d="M16 18c0-6 5-10 10-8" fill="none" stroke="#2F7BFF" stroke-width="4" stroke-linecap="round"/>
            <path d="M48 18c0-6-5-10-10-8" fill="none" stroke="#2F7BFF" stroke-width="4" stroke-linecap="round"/>
            <ellipse cx="18" cy="18" rx="8" ry="5.5" fill="#3B8BFF" stroke="#163A8C" stroke-width="2"/>
            <ellipse cx="46" cy="18" rx="8" ry="5.5" fill="#3B8BFF" stroke="#163A8C" stroke-width="2"/>
            <rect x="28" y="10" width="8" height="7" rx="2" fill="#3B8BFF" stroke="#163A8C" stroke-width="1.5"/>
            <circle cx="32" cy="38" r="18" fill="#2F6FE8" stroke="#163A8C" stroke-width="3"/>
            <circle cx="32" cy="38" r="13" fill="#F4F8FF" stroke="#8FB4F0" stroke-width="1.5"/>
            <path d="M32 29.5 V38 L39 42" fill="none" stroke="#163A8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="32" cy="38" r="2" fill="#163A8C"/>
            <path d="M20 52 l-5 6 M44 52 l5 6" stroke="#2F6FE8" stroke-width="3.5" stroke-linecap="round"/>
          </svg>
          <span id="hud-timer">03:00</span>
        </div>
        <div class="pill-diff" id="pill-diff">
          <svg class="cat-svg" id="diff-icon" width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
            <path d="M8 30 L16 6 L28 26 Z" fill="#fff"/>
            <path d="M56 30 L48 6 L36 26 Z" fill="#fff"/>
            <path d="M12 14 L18 2 L22 16 Z" fill="#F2F2F2" stroke="#D0D0D0" stroke-width="1"/>
            <path d="M52 14 L46 2 L42 16 Z" fill="#F2F2F2" stroke="#D0D0D0" stroke-width="1"/>
            <ellipse cx="32" cy="40" rx="18" ry="15" fill="#fff"/>
            <ellipse cx="24" cy="40" rx="3.4" ry="4.2" fill="#1A1A1A"/>
            <ellipse cx="40" cy="40" rx="3.4" ry="4.2" fill="#1A1A1A"/>
            <ellipse cx="25" cy="39" rx="1.1" ry="1.3" fill="#fff"/>
            <ellipse cx="41" cy="39" rx="1.1" ry="1.3" fill="#fff"/>
            <path d="M32 44 l-2.4 2.6 h4.8 Z" fill="#E23B34"/>
            <path d="M24 49 Q32 54 40 49" fill="none" stroke="#222" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M14 36 Q8 32 12 28" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
            <path d="M50 36 Q56 32 52 28" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
          </svg>
          <span class="diff-text" id="diff-text">HARD</span>
        </div>
      </div>
      <div id="hud-coins">
        <span class="coin-disc" aria-hidden="true"></span>
        <span id="coin-val">0</span>
      </div>
    </div>
    <div id="settings-panel" class="hidden">
      <div class="panel-card">
        <h2>설정</h2>
        <label class="toggle-row"><span>소리</span><input type="checkbox" id="toggle-sound" checked /></label>
        <label class="toggle-row"><span>진동</span><input type="checkbox" id="toggle-haptic" checked /></label>
        <button id="btn-restart" class="panel-btn">다시하기</button>
        <button id="btn-close-settings" class="panel-btn secondary">닫기</button>
      </div>
    </div>
    <div id="win-overlay" class="hidden">
      <div class="win-card">
        <div class="win-title">Complete!</div>
        <div class="win-sub">Level <span id="win-level">1</span></div>
        <div class="win-coins">+<span id="win-coins">50</span> 🪙</div>
        <button id="btn-next" class="panel-btn">Next</button>
      </div>
    </div>
    <div id="fail-overlay" class="hidden">
      <div class="win-card">
        <div class="win-title">Time's up</div>
        <button id="btn-retry" class="panel-btn">Retry</button>
      </div>
    </div>
  </div>
  <script type="module" src="js/main.js?v=spring29mat"></script>
</body>
</html>
